[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    crypto: testes que requerem a lib 'cryptography'
    hardware: testes que requerem hardware real conectado (skip por padrão)
    slow: testes lentos (>1s)
